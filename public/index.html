<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start · ida 2030</title>
  <meta name="description" content="ida 2030: digitale Verwaltungsassistenz (Hackathon-Prototyp)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="ida-header"></div>
  <main id="main" tabindex="-1">

    <section class="hero">
      <div class="container-xl">
        <span class="kicker" data-i18n="home_kicker"></span>
        <h1><span data-i18n="home_title"></span></h1>
        <p class="lead" data-i18n="home_sub"></p>
        <form id="intent-form" class="intent mt-4" role="search">
          <label for="intent-input" class="visually-hidden" data-i18n="home_title"></label>
          <input id="intent-input" type="text" autocomplete="off" data-i18n-ph="home_ph">
          <button type="button" class="btn btn-outline-ink btn-mic" id="intent-mic" aria-pressed="false" data-i18n-aria="mic"><i class="bi bi-mic-fill" aria-hidden="true"></i></button>
          <button type="submit" class="btn btn-rot"><span data-i18n="home_go"></span> <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
        </form>
        <div class="chips" id="examples">
          <button type="button" class="chip" data-i18n="ex1"></button>
          <button type="button" class="chip" data-i18n="ex2"></button>
          <button type="button" class="chip" data-i18n="ex3"></button>
        </div>
      </div>
    </section>

    <section class="container-xl mb-5" id="nudge-wrap" hidden>
      <h2 class="h5 mb-3"><i class="bi bi-stars text-rot" aria-hidden="true"></i> <span data-i18n="nudges_title"></span></h2>
      <div class="d-grid gap-2" id="nudges"></div>
    </section>

    <section class="container-xl">
      <div class="row g-3">
        <div class="col-md-6 col-xl-3"><a class="tile" href="/umzug.html"><i class="bi bi-box-seam" aria-hidden="true"></i><h2 data-i18n="tile_moving_t"></h2><p data-i18n="tile_moving_d"></p></a></div>
        <div class="col-md-6 col-xl-3"><a class="tile" href="/brief.html"><i class="bi bi-envelope-paper" aria-hidden="true"></i><h2 data-i18n="tile_letter_t"></h2><p data-i18n="tile_letter_d"></p></a></div>
        <div class="col-md-6 col-xl-3"><a class="tile" href="/reisepass.html"><i class="bi bi-passport" aria-hidden="true"></i><h2 data-i18n="tile_passport_t"></h2><p data-i18n="tile_passport_d"></p></a></div>
        <div class="col-md-6 col-xl-3"><a class="tile tile-human" href="#" id="tile-human"><i class="bi bi-person-raised-hand" aria-hidden="true"></i><h2 data-i18n="tile_human_t"></h2><p data-i18n="tile_human_d"></p></a></div>
      </div>
    </section>
  </main>
  <div id="ida-footer"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/home.js"></script>
</body>
</html>
