<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistent · ida 2030</title>
  <meta name="description" content="ida 2030: digitale Verwaltungsassistenz (Hackathon-Prototyp)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="ida-header"></div>
  <main id="main" tabindex="-1">

    <div class="container-xl">
      <header class="page-head pb-3">
        <span class="kicker">ida 2030</span>
        <h1 class="section-title" data-i18n="as_title"></h1>
      </header>
      <div class="row g-4">
        <div class="col-lg-8">
          <div id="chat" class="chat" role="log" aria-live="polite" aria-label="Chat"></div>
          <div id="typing" class="typing" hidden><span data-i18n="typing"></span> <span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <div id="quick" class="quick no-explain"></div>
          <form id="composer" class="composer no-explain" autocomplete="off">
            <label for="msg" class="visually-hidden" data-i18n="as_ph"></label>
            <input id="msg" class="form-control form-control-lg" data-i18n-ph="as_ph">
            <button type="button" class="btn btn-outline-ink btn-mic" id="mic" aria-pressed="false" data-i18n-aria="mic"><i class="bi bi-mic-fill" aria-hidden="true"></i></button>
            <button type="submit" class="btn btn-rot"><i class="bi bi-send" aria-hidden="true"></i><span class="d-none d-sm-inline" data-i18n="send"></span></button>
          </form>
        </div>
        <div class="col-lg-4">
          <aside id="draft" class="ida-card no-explain" hidden aria-labelledby="draft-title"></aside>
        </div>
      </div>
    </div>
  </main>
  <div id="ida-footer"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/assistant.js"></script>
</body>
</html>
