<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Briefe & Fristen · ida 2030</title>
  <meta name="description" content="ida 2030: digitale Verwaltungsassistenz (Hackathon-Prototyp)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="ida-header"></div>
  <main id="main" tabindex="-1">

    <div class="container-xl">
      <header class="page-head">
        <span class="kicker" data-i18n="nav_letters"></span>
        <h1 class="section-title" data-i18n="lt_title"></h1>
        <p class="lead" data-i18n="lt_sub"></p>
      </header>
      <div class="row g-4">
        <div class="col-lg-4">
          <h2 class="h5" data-i18n="postkorb"></h2>
          <div id="letters" class="no-explain"></div>
          <div class="ida-card mt-4 no-explain">
            <h2 class="h5" data-i18n="upload_title"></h2>
            <p class="small text-muted" data-i18n="upload_hint"></p>
            <label class="dropzone d-block" id="dropzone" for="lt-file">
              <i class="bi bi-camera fs-2 text-rot" aria-hidden="true"></i>
              <span class="d-block fw-bold mt-1" data-i18n="choose_file"></span>
              <span class="d-block small text-muted" id="lt-filename"></span>
            </label>
            <input type="file" id="lt-file" class="visually-hidden" accept="image/jpeg,image/png,image/webp,application/pdf" capture="environment">
            <p class="small text-muted text-center my-2" data-i18n="or_paste"></p>
            <label for="lt-text" class="visually-hidden" data-i18n="or_paste"></label>
            <textarea id="lt-text" class="form-control" rows="4" data-i18n-ph="paste_ph"></textarea>
            <button class="btn btn-rot w-100 mt-3" id="lt-analyze"><i class="bi bi-magic" aria-hidden="true"></i> <span data-i18n="analyze"></span></button>
          </div>
        </div>
        <div class="col-lg-8">
          <section id="lt-result" class="ida-card" aria-live="polite">
            <div class="text-center text-muted py-5"><i class="bi bi-envelope-open fs-1 text-rot" aria-hidden="true"></i><p class="mt-3 mb-0" data-i18n="no_letter"></p></div>
          </section>
          <div class="callout callout-info"><i class="bi bi-info-circle" aria-hidden="true"></i> <span data-i18n="rsb_note"></span></div>
        </div>
      </div>
    </div>
  </main>
  <div id="ida-footer"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/brief.js"></script>
</body>
</html>
