<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reisepass · ida 2030</title>
  <meta name="description" content="ida 2030: digitale Verwaltungsassistenz (Hackathon-Prototyp)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="ida-header"></div>
  <main id="main" tabindex="-1">

    <div class="container-xl">
      <header class="page-head">
        <span class="kicker" data-i18n="nav_passport"></span>
        <h1 class="section-title" data-i18n="pp_title"></h1>
        <p class="lead" data-i18n="pp_sub"></p>
      </header>
      <div id="pp-status" class="mb-4"></div>
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="ida-card h-100 no-explain">
            <h2 class="h5" data-i18n="checklist_title"></h2>
            <div id="pp-checklist" class="mt-3"></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="ida-card h-100 no-explain">
            <h2 class="h5" data-i18n="photo_title"></h2>
            <p class="small text-muted" data-i18n="photo_hint"></p>
            <div class="photo-stage mb-3" id="photo-stage"><div class="oval"></div></div>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
              <button class="btn btn-outline-ink btn-sm" id="cam-start"><i class="bi bi-camera-video" aria-hidden="true"></i> <span data-i18n="camera"></span></button>
              <button class="btn btn-outline-ink btn-sm d-none" id="cam-shot"><i class="bi bi-camera" aria-hidden="true"></i> <span data-i18n="take_photo"></span></button>
              <label class="btn btn-outline-ink btn-sm mb-0" for="photo-file"><i class="bi bi-upload" aria-hidden="true"></i> <span data-i18n="upload_photo"></span></label>
              <input type="file" id="photo-file" class="visually-hidden" accept="image/jpeg,image/png,image/webp" capture="user">
            </div>
            <button class="btn btn-rot w-100 mt-3" id="photo-check" disabled><i class="bi bi-person-bounding-box" aria-hidden="true"></i> <span data-i18n="check_photo"></span></button>
            <div id="photo-result" class="mt-3" aria-live="polite"></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="ida-card h-100 no-explain">
            <h2 class="h5" data-i18n="offices_title"></h2>
            <form class="d-flex gap-2 mb-2" id="office-form">
              <label for="office-postal" class="visually-hidden" data-i18n="postal_ph"></label>
              <input class="form-control" id="office-postal" inputmode="numeric" maxlength="4" data-i18n-ph="postal_ph">
              <button class="btn btn-ink" type="submit"><i class="bi bi-search" aria-hidden="true"></i><span class="visually-hidden" data-i18n="search"></span></button>
            </form>
            <p class="small text-muted" data-i18n="any_office_note"></p>
            <div id="offices"></div>
          </div>
        </div>
      </div>
      <section id="pass-wrap" class="mt-4" hidden>
        <div class="counter-pass">
          <div class="row g-4 align-items-center">
            <div class="col-md-auto text-center"><div id="qr"></div></div>
            <div class="col">
              <span class="kicker" data-i18n="ready_pack"></span>
              <div class="ref" id="pass-ref"></div>
              <p class="mb-1 fw-bold" id="pass-office"></p>
              <p class="mb-2" id="pass-slot"></p>
              <p class="small text-muted mb-3" data-i18n="qr_hint"></p>
              <button class="btn btn-outline-ink no-print" onclick="window.print()"><i class="bi bi-printer" aria-hidden="true"></i> <span data-i18n="print"></span></button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <div id="ida-footer"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/reisepass.js"></script>
</body>
</html>
